# The project config: the environments, the blueprints, the EDA defaults and the analysis thresholds, one file read by
# axis_of_travel_rnn.config (section("blueprints.blocks_v1") and the like). The experiment presets stay one file each in
# configs/experiments/, and the machine-local paths in configs/local.yaml.

# Environments by name, read by the block engine's geometry (axis_of_travel_rnn.blocks.geometry). Parameters, never raw geometry. An entry
# may name a base entry and a transform (rotate_deg), merged over the base.
environments:
  triple_t:
    # Faithful recreation of the Olson 2017 triple-T within the paper's constraints.
    # PAPER-PINNED: envelope, corridor_width, run_segments (turns at 0.51/0.87/1.18).
    # INFERRED: east-west goal approaches, perimeter return topology (see build_triple_t in src/axis_of_travel_rnn/blocks/geometry.py).
    # Replace params with Doug's measurements when available: everything else derives.
    # OPTIONAL start_offset (metres, default 0, not set yet): the paper's start site sits up the stem above the bottom
    # return corridor, and the paper gives no number. With 0 the start is on the bottom corridor. A positive value
    # continues the stem below the start to meet the bottom corridor, moves the start and the maze body up by it and
    # keeps the envelope. Set it from the data: take the median start offset over a few built sessions, put it under
    # params, then rebuild the blocks (the offsets move into the blueprint, see docs/restructure).
    type: triple_t
    room: {extent: [1.8, 1.8]}
    params:
      corridor_width: 0.08
      envelope: [1.60, 1.25]
      run_segments: [0.51, 0.36, 0.31, 0.22]
  open_arena:
    # Open arena analog: 0.6 m circle centered in the same room frame,
    # mirroring the arena placed above the track center in the paper.
    type: circle
    room: {extent: [1.8, 1.8]}
    params:
      diameter: 0.6
      n_vertices: 32

# Blueprints by name, read by axis_of_travel_rnn.blocks.blueprint, which refuses an unknown key. The build's manifest records
# the sha256 of a blueprint's own section in canonical json (sorted keys, no spaces), so a comment here changes nothing.
blueprints:
  blocks_v1:
    # The first block dataset: every reviewed session, built with the engine's rules and window settings as the review tool
    # built them. pixi run build-blocks --blueprint blocks_v1 writes PROCESSED_LAB_DATA/blocks_v1/. Every key is read by
    # axis_of_travel_rnn.blocks.blueprint, which refuses an unknown one. The reviews are read from PROCESSED_LAB_DATA/review/,
    # where the review tool writes them, as no reviews key names another folder.
    name: blocks_v1
    format_version: 4   # the review tool's format version the review files and blocks follow
    description: Every reviewed session, the engine's default rules and settings, the start offsets from the reviews.
    transformed: TRANSFORMED_LAB_DATA   # the configs/local.yaml key of the transformed folder
    sessions: all_reviewed              # or a list of session ids
    rules: {}                           # overrides over blocks.RULES, none for the defaults
    settings: {}                        # overrides over blocks.SETTINGS, recorded in each session's metadata
    start_offsets: from_reviews         # or session id to metres, the sessions not listed taking their review's
    expected_data_id: null              # the data id of the first build, written in after it (docs/restructure/tasks.md step 12)
  sample:
    # The committed sample for the drift guard (pixi run smoke): three synthetic sessions of the block tests' fixture
    # (tests/unit/blocks/fixtures.py), never a real recording, built by pixi run python tests/fixtures/make_sample.py into tests/fixtures/sample/.
    # That script writes the fixture's transformed folder and accepted reviews to a temporary folder and runs the build on
    # them, so transformed and reviews name nothing here, and pixi run build-blocks does not build this blueprint.
    name: sample
    format_version: 4
    description: Three fixture sessions on three dates, four blocks (two arena, two track), for the smoke run.
    transformed: made_by_tests/fixtures/make_sample.py
    reviews: made_by_tests/fixtures/make_sample.py
    sessions: [NS14_rec1_20150101_001, JL1_rec4_20140704_001, NS16_rec6_20150106_001]
    rules: {}
    settings: {}
    start_offsets: from_reviews
    expected_data_id: bdf45846cfff30ccbe153f98431515938a9c1a3a116723ce347a69e8511bdc37
    built: tests/fixtures/sample   # read by load_blocks from the repository, no configs/local.yaml needed

# The defaults of an EDA notebook (pixi run new-eda): the blueprint it reads and the figure resolution.
eda:
  default: {blueprint: blocks_v1, figure_dpi: 150}

# The analysis thresholds, read by axis_of_travel_rnn.analysis.load_thresholds and named by an experiment config's
# analysis.thresholds.
analysis:
  thresholds:
    # Pilot thresholds, fixed before any pilot network is trained or analysed. Provisional in the sense that the authors may
    # revise them later, but never after seeing an axis result. Each value is a plain number read once by the notebook.

    # Which steps and cells count (brief 8)
    moving_speed_m_s: 0.03          # steps slower than this have no direction of travel
    heading_tolerance_deg: 45       # heading this close to a corridor direction counts as travelling that way
    activity_floor: 0.05            # mean normalised activity (E+W)/2 of a unit on a segment below this: no index, not eligible

    # Direction test 8.1 and axis test 8.2
    direction_index_min: 0.33       # abs(E - W) / (E + W) on both parallel segments, same preferred direction
    axis_selectivity_min: 0.33      # (mean of the four E-W cells - mean of the four N-S cells) / their sum
    balance_index_max: 0.33         # abs(E - W) / (E + W) on each of the two segments of the axis must stay below this
    place_general_min: 0.5          # the weaker of the two parallel segments is at least this fraction of the stronger
    null_percentile: 99             # a unit must beat this percentile of the null
    n_permutations: 1000            # pass-level label permutations in the loop (replaces circular shifts there, issue 21)

    # Arena test 8.3 (open field, circular shifts)
    n_shifts: 200
    min_shift_s: 20
    arena_bins: 36                  # heading bins for the tuning curve
    persist_majority: 0.5           # "axis units mostly persist in the arena": more than this fraction of them

    # Section 2 training checks
    beat_persistence_ratio: 0.8     # trained test loss at horizon 10 at most this times the persistence loss
    beat_memoryless_ratio: 0.9      # place_only: trained test loss at most this times the memoryless loss
    position_r2_min: 0.5            # ridge decoder from hidden state to position, test sessions

    # Section 4 bar and decision table
    min_unit_fraction: 0.05         # released axis units, as a fraction of all hidden units
    untrained_percentile: 95        # and above this percentile of the 20 untrained draws of the same input set
    seeds_required: all             # every trained seed of the arm must meet both
    diet_match_ratio: 0.8           # arena-only diet "matches" loop-and-arena when its released-axis fraction is at least this
                                    # fraction of the loop-and-arena one (in the mean over seeds)
