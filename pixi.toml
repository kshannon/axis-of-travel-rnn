[workspace]
authors   = ["Kyle Shannon <kyle@kmshannon.com>"]
channels  = ["conda-forge"]
name      = "axis-of-travel-rnn"
platforms = ["osx-arm64", "linux-64"]
version   = "0.1.0"


###################### ======== TASKS ======== ######################
[tasks]
# Lab notebook: a dated entry from templates/labnotebook.md, optional slug words
new-labnote = "python -m proj_helpers.notebooks labnote"

# Lab data converter (docs/transform_lab_data/): MATLAB files to CSV and Parquet
transform-lab-data = "python -m transform_lab_data"

# Block step (configs/blueprints/): transformed folder and review files to PROCESSED_LAB_DATA/<blueprint>/
build-blocks = "python -m axis_of_travel_rnn.blocks"

# Testing
test     = "python -m pytest"
test-cov = "python -m pytest --cov=src --cov-report=term-missing"

# Jupyter notebooks: create one from the template; strip outputs on commit (once per clone)
new-jupyter-nb       = "python -m proj_helpers.notebooks notebook"
nbstripout-install   = "nbstripout --install --attributes .gitattributes"


###################### ======== DEPENDENCIES ======== ######################
[dependencies]
# Core ML
python  = "=3.12"
pytorch = ">=2.1,<3"
numpy   = ">=1.26"
scipy   = ">=1.11"
pandas  = ">=2"
tqdm    = ">=4.66"

# Data I/O
h5py     = ">=3.10"   # for MATLAB v7.3 .mat files
pyarrow  = ">=14"     # the full package: Parquet frames and CSV

# Visualization
matplotlib = ">=3.8"
seaborn    = ">=0.13"

# Validation
pydantic = ">=2.5"
pyyaml = ">=6"

[pypi-dependencies]
# The project package itself, editable so src/ edits are live.
axis-of-travel-rnn = { path = ".", editable = true }

###################### ======== DEV / CUDA FEATURES ======== ######################
[feature.dev.dependencies]
pip          = "*"
pytest       = ">=7.4"
pytest-cov   = "*"
pytest-xdist = "*"
jupyter      = "*"
ipython      = "*"
ipytest      = "*"
nbformat     = "*"
nbstripout   = "*"

[feature.dev.pypi-dependencies]
scienceplots = ">=2"

# ---- cuda feature: GPU builds, Linux clusters etc. ----
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12"

[feature.cuda.dependencies]
pytorch = { version = ">=2.1,<3", build = "cuda*" }


###################### ======== ENVS ======== ######################
[environments]
default   = { features = ["dev"] }
cuda      = { features = ["dev", "cuda"] }
