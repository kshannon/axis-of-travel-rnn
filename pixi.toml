[workspace]
authors   = ["Kyle Shannon <kyle@kmshannon.com>"]
channels  = ["conda-forge"]
name      = "axis-of-travel-rnn"
platforms = ["osx-arm64", "linux-64"]
version   = "0.1.0"


###################### ======== TASKS ======== ######################
[tasks]
# Project CLI is an installed console script, no task needed:
#   pixi run axis-of-travel-rnn env list

# Lab notebook: a dated entry from templates/labnotebook.md, optional slug words
new-labnote = 'axis-of-travel-rnn labnote new'

# Lab data converter (docs/transform_lab_data/): MATLAB files to CSV and Parquet
transform-lab-data = "python -m transform_lab_data"

# Lab data processor (docs/process_lab_data/): the converter's tables to trajectory blocks in metres
process-lab-data = "python -m process_lab_data"

# RatReplay (docs/ratreplay/): replay a session in the browser and confirm its blocks
ratreplay = "python -m ratreplay"

# Testing
test     = "python -m pytest"
test-cov = "python -m pytest --cov=src --cov-report=term-missing"

# Jupyter notebooks: create one from the template; strip outputs on commit (once per clone)
new-jupyter-nb       = "axis-of-travel-rnn notebook new"
nbstripout-install   = "nbstripout --install --attributes .gitattributes"


###################### ======== DEPENDENCIES ======== ######################
[dependencies]
# Core ML
python  = "=3.12"
pytorch = ">=2.1,<3"
einops  = ">=0.7"
numpy   = ">=1.26"
scipy   = ">=1.11"

# Data I/O
pynwb    = ">=2.5"
h5py     = ">=3.10"   # for MATLAB v7.3 .mat files
pyarrow  = ">=14"     # the full package: Parquet frames and CSV
dandi    = ">=0.58"
zarr     = ">=3,<4"
xarray   = ">=2023.6"

# Visualization
matplotlib = ">=3.8"
seaborn    = ">=0.13"
plotly     = ">=5.20"   # RatReplay (docs/ratreplay/)
dash       = ">=2.17"   # same

# Validation and Stats
pymc = ">=5.10.0"
arviz = "=1.1.0"
nutpie = ">=0.15.0"
pydantic = ">=2.5"
pyyaml = ">=6"

[pypi-dependencies]
pynapple = ">=0.4"
ratinabox = ">=1"
# The project package itself, editable so src/ edits are live.
axis-of-travel-rnn = { path = ".", editable = true }

###################### ======== DEV / CUDA FEATURES ======== ######################
[feature.dev.dependencies]
pip          = "*"
pytest       = ">=7.4"
pytest-cov   = "*"
pytest-xdist = "*"
jupyter      = "*"
ipython      = "*"
ipytest      = "*"
nbformat     = "*"
nbstripout   = "*"

[feature.dev.pypi-dependencies]
scienceplots = ">=2"

# ---- cuda feature: GPU builds, Linux clusters etc. ----
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12"

[feature.cuda.dependencies]
pytorch = { version = ">=2.1,<3", build = "cuda*" }


###################### ======== ENVS ======== ######################
[environments]
default = { features = ["dev"] }
cuda    = { features = ["dev", "cuda"] }
